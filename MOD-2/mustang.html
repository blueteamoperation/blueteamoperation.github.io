<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terminal de Análise Forense v3.0</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px;
            background: #020606;
            color: #d0d0d0;
            font-family: "Courier New", monospace;
        }

        .terminal {
            position: relative;
            max-width: 1450px;
            margin: auto;
            padding: 48px 50px 55px;
            border: 2px solid #00ffff;
            border-radius: 15px;
            background: #000;
            box-shadow:
                0 0 25px rgba(0, 255, 255, 0.15),
                inset 0 0 30px rgba(0, 255, 255, 0.03);
        }

        .terminal-title {
            position: absolute;
            top: -17px;
            left: 35px;
            padding: 5px 18px;
            background: #020606;
            color: #ffe600;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .mission {
            border-left: 5px solid #ffe600;
            padding: 0 0 0 32px;
            margin-bottom: 45px;
        }

        .mission h1 {
            margin: 0 0 25px;
            color: #ffe600;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .mission p {
            color: #8b8b8b;
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .mission strong {
            color: #aaa;
        }

        .image-box {
            width: 100%;
            min-height: 350px;
            border: 1px solid #333;
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-placeholder {
            text-align: center;
            color: #555;
        }

        .image-placeholder .icon {
            font-size: 55px;
            margin-bottom: 12px;
        }

        .image-placeholder strong {
            display: block;
            color: #777;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .image-placeholder span {
            font-size: 14px;
        }

        /*
           Para utilizar uma imagem real, substitua o conteúdo
           da DIV .image-box por:

           <img src="mustang.jpg" alt="Evidência">
        */

        .image-box img {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
        }

        .questions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px 35px;
        }

        .question {
            position: relative;
        }

        .question.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 70px;
            padding: 0 20px;
            background: #080808;
            border: 1px solid #333;
            border-bottom: 3px solid #333;
            color: #fff;
            font-family: "Courier New", monospace;
            font-size: 20px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
        }

        input.correct {
            border-color: #00ff88;
            color: #00ff88;
        }

        input.wrong {
            border-color: #ff3b3b;
            color: #ff5555;
        }

        .status {
            min-height: 24px;
            padding-top: 7px;
            font-size: 14px;
        }

        .status.ok {
            color: #00ff88;
        }

        .status.error {
            color: #ff4545;
        }

        .actions {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 28px;
            background: transparent;
            border: 1px solid #ffe600;
            color: #ffe600;
            font-family: "Courier New", monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ffe600;
            color: #000;
        }

        .reset {
            border-color: #555;
            color: #777;
        }

        .reset:hover {
            background: #555;
            color: #fff;
        }

        #resultado {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border: 1px solid #00ff88;
            color: #00ff88;
            font-size: 18px;
            line-height: 1.7;
            background: rgba(0, 255, 136, 0.04);
        }

        #resultado.erro-geral {
            border-color: #ff4545;
            color: #ff4545;
            background: rgba(255, 0, 0, 0.04);
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 850px) {
            body {
                padding: 15px;
            }

            .terminal {
                padding: 40px 20px;
            }

            .questions {
                grid-template-columns: 1fr;
            }

            .question.full {
                grid-column: auto;
            }

            .mission h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="terminal-title">
        TERMINAL DE ANÁLISE FORENSE v3.0
    </div>

    <div class="mission">

        <h1>
            MISSÃO: EXTRAÇÃO DE METADADOS EXIF
        </h1>

        <p>
            Analise o arquivo <strong>mustang.jpg</strong>.
            Utilize ferramentas como <em>ExifTool</em> ou
            <em>ExifView</em> para extrair as propriedades brutas
            (Metadata) da evidência e preencha o relatório de custódia.
        </p>

        <div class="image-box">

            <img src="https://raw.githubusercontent.com/blueteamoperation/blueteamoperation.github.io/refs/heads/main/MOD-2/foto.jpeg" width="280" alt="Evidência Forense">

          
            </div>

        </div>

    </div>


    <div class="questions">

        <div class="question">

            <label>
                01. CAMERA MODEL NAME
            </label>

            <input
                type="text"
                id="q1"
                autocomplete="off"
                placeholder="Digite a resposta..."
            >

            <div class="status" id="s1"></div>

        </div>


        <div class="question">

            <label>
                02. SOFTWARE VERSION
            </label>

            <input
                type="text"
                id="q2"
                autocomplete="off"
                placeholder="Digite a resposta..."
            >

            <div class="status" id="s2"></div>

        </div>


        <div class="question">

            <label>
                03. CREATE DATE (AAAA:MM:DD)
            </label>

            <input
                type="text"
                id="q3"
                autocomplete="off"
                placeholder="Digite a resposta..."
            >

            <div class="status" id="s3"></div>

        </div>


        <div class="question">

            <label>
                04. GPS POSITION (PARTIAL)
            </label>

            <input
                type="text"
                id="q4"
                autocomplete="off"
                placeholder="Digite a resposta..."
            >

            <div class="status" id="s4"></div>

        </div>


        <div class="question full">

            <label>
                05. USER COMMENT (FLAG)
            </label>

            <input
                type="text"
                id="q5"
                autocomplete="off"
                placeholder="Digite a resposta..."
            >

            <div class="status" id="s5"></div>

        </div>

    </div>


    <div class="actions">

        <button onclick="validar()">
            [ VALIDAR EVIDÊNCIA ]
        </button>

        <button class="reset" onclick="limpar()">
            [ LIMPAR ]
        </button>

    </div>


    <div id="resultado"></div>

</div>


<script>

    /*
     * ============================================================
     * GABARITO
     * ============================================================
     *
     * Validação direta.
     * NÃO utiliza MD5, SHA1, SHA256 ou qualquer outro hash.
     *
     */

    const respostas = {

        q1: "iPhone 15 Pro Max",

        q2: "Adobe Photoshop 25.0 Windows",

        q3: "2026:04:25",

        q4: "23.57 S, 46.64 W",

        q5: "METADATA_MASTER_2026"

    };


    function validar() {

        let acertos = 0;

        const total = Object.keys(respostas).length;


        for (const campo in respostas) {

            const input =
                document.getElementById(campo);

            const numero =
                campo.substring(1);

            const status =
                document.getElementById("s" + numero);


            /*
             * Remove apenas espaços extras
             * no começo/final.
             *
             * A resposta continua sendo comparada
             * exatamente com o gabarito.
             */

            const respostaUsuario =
                input.value.trim();


            if (respostaUsuario === respostas[campo]) {

                input.classList.remove("wrong");

                input.classList.add("correct");

                status.className = "status ok";

                status.textContent =
                    "[+] RESPOSTA CORRETA";

                acertos++;

            } else {

                input.classList.remove("correct");

                input.classList.add("wrong");

                status.className = "status error";

                status.textContent =
                    "[-] RESPOSTA INCORRETA";

            }

        }


        const resultado =
            document.getElementById("resultado");


        resultado.style.display = "block";


        if (acertos === total) {

            resultado.className = "";

            resultado.innerHTML =

                "[+] ANÁLISE CONCLUÍDA COM SUCESSO<br>" +

                "[+] METADADOS IDENTIFICADOS: " +
                acertos + "/" + total +

                "<br>[+] EVIDÊNCIA VALIDADA" +

                '<span class="cursor">_</span>';

        } else {

            resultado.className =
                "erro-geral";

            resultado.innerHTML =

                "[-] ANÁLISE INCOMPLETA<br>" +

                "[*] RESPOSTAS CORRETAS: " +
                acertos + "/" + total +

                "<br>[!] REVISE OS METADADOS DA EVIDÊNCIA" +

                '<span class="cursor">_</span>';

        }

    }


    function limpar() {

        for (const campo in respostas) {

            const input =
                document.getElementById(campo);

            const numero =
                campo.substring(1);

            const status =
                document.getElementById("s" + numero);


            input.value = "";

            input.classList.remove(
                "correct",
                "wrong"
            );

            status.textContent = "";

        }


        const resultado =
            document.getElementById("resultado");

        resultado.style.display = "none";

    }

</script>

</body>
</html>
